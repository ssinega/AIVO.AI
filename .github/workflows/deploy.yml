name: CI/CD Build & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Full-Stack Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Frontend Node Dependencies
        run: npm ci

      - name: Run TypeScript & Lint Verification
        run: npm run lint

      - name: Build Frontend Production Artifacts
        run: npm run build

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Backend Code & Imports
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/ai/graph.py

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build-artifact
          path: dist/
          retention-days: 7
